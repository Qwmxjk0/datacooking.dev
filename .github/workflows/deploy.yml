name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: SSH_PASS
      url: https://datacooking.dev
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=${{ env.REGISTRY }}/${owner}/datacooking" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy compose files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.DEPLOY_HOST || secrets.DEPLOY_HOST || '109.205.178.227' }}
          username: ${{ vars.DEPLOY_USER || secrets.DEPLOY_USER || 'qwmxjk0' }}
          password: ${{ secrets.SECRET }}
          source: "docker-compose.prod.yml,Caddyfile"
          target: /home/qwmxjk0/datacooking

      - name: Pull and run
        uses: appleboy/ssh-action@v1.2.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_IMAGE: ${{ env.IMAGE }}:${{ github.sha }}
          GHCR_USER: qwmxjk0
          DOMAIN: ${{ vars.DOMAIN || 'datacooking.dev' }}
        with:
          host: ${{ vars.DEPLOY_HOST || secrets.DEPLOY_HOST || '109.205.178.227' }}
          username: ${{ vars.DEPLOY_USER || secrets.DEPLOY_USER || 'qwmxjk0' }}
          password: ${{ secrets.SECRET }}
          envs: GITHUB_TOKEN,APP_IMAGE,GHCR_USER,DOMAIN
          script: |
            set -euo pipefail
            mkdir -p /home/qwmxjk0/datacooking
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            cd /home/qwmxjk0/datacooking
            export APP_IMAGE
            export DOMAIN="${DOMAIN:-datacooking.dev}"
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
            curl -fsS http://127.0.0.1/health
